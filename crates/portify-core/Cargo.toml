[package]
name = "portify-core"
description = "Port and process inspection engine shared by the Portify CLI and desktop app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
# Five is the crates.io maximum, so these are the words someone would actually
# search when they have a port they cannot free.
keywords = ["port", "netstat", "sockets", "process", "tcp"]
categories = ["network-programming", "os"]

[dependencies]
netstat2 = "0.11.2"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
serde.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
