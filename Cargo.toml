[workspace]
members = ["crates/portify-core", "crates/portify-cli", "app/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
authors = ["Diego Fagundez"]
license = "MIT"
repository = "https://github.com/dfagundez/portify"
homepage = "https://github.com/dfagundez/portify"

[workspace.dependencies]
portify-core = { path = "crates/portify-core", version = "0.1.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"

# Release profile tuned for small single-file binaries: this is the whole point
# of moving off Python, so don't leave it on the defaults.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# `panic = "abort"` is deliberately NOT set: Tauri relies on unwinding in its
# command dispatch, and a few hundred KB is not worth losing that.
