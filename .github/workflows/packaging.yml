name: Packaging

# Fires when a release is *published*, not when its tag is pushed. Releases are
# created as drafts, and a draft's assets cannot be downloaded — so there is
# nothing to checksum until someone clicks Publish.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sync the manifests to (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  manifests:
    name: sync package manifests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Point the manifests at the new release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-packaging.mjs "${{ github.event.inputs.tag || github.event.release.tag_name }}"

      - name: Verify before committing
        run: node scripts/check-packaging.mjs

      - name: Commit
        run: |
          if git diff --quiet; then
            echo "manifests already current; nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket packaging
          TAG="${{ github.event.inputs.tag || github.event.release.tag_name }}"
          git commit -m "📦 chore: point the package manifests at ${TAG}

          Generated by scripts/update-packaging.mjs and verified against the
          published assets before committing."
          git push origin main

      - name: Remind about winget
        run: |
          TAG="${{ github.event.inputs.tag || github.event.release.tag_name }}"
          {
            echo "### Scoop"
            echo "\`bucket/portify.json\` now points at \`${TAG}\`. Nothing else to do —"
            echo "the bucket is this repository, so users get it on their next \`scoop update\`."
            echo ""
            echo "### winget"
            echo "Still needs a pull request to \`microsoft/winget-pkgs\`; they do not read"
            echo "manifests from anywhere else. Copy the three files from \`packaging/winget/\`"
            echo "into \`manifests/d/DiegoFagundez/Portify/${TAG#v}/\` in a fork and open a PR."
          } >> "$GITHUB_STEP_SUMMARY"
