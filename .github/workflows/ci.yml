name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Fail the build on warnings rather than letting them pile up.
  RUSTFLAGS: -D warnings

jobs:
  # Cheap, no toolchain, and catches the one packaging failure that reaches
  # strangers before it reaches us: manifests still pointing at the previous
  # release's binary after a version bump.
  packaging:
    name: packaging manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/check-packaging.mjs

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows first: it is the primary target platform.
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux desktop dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # The frontend must be built before any cargo command that touches the
      # app crate: `tauri::generate_context!` embeds app/dist at compile time
      # and fails if the directory does not exist.
      - name: Build frontend
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Smoke-test the CLI
        shell: bash
        run: |
          cargo run -q -p portify-cli -- --version
          cargo run -q -p portify-cli -- list --json > ports.json
          cargo run -q -p portify-cli -- info
          cargo run -q -p portify-cli -- completions bash > /dev/null
          # Exit codes are a documented interface, so check them rather than
          # trusting that nothing reshuffled them. The 2-vs-4 split matters
          # most: a script must be able to tell "the port is free" from
          # "you typed the command wrong".
          check() {
            expected=$1; shift
            set +e
            cargo run -q -p portify-cli -- "$@" >/dev/null 2>&1
            code=$?
            set -e
            test "$code" -eq "$expected" \
              || { echo "expected exit $expected from 'portify $*', got $code"; exit 1; }
          }
          check 2 list 1                  # port 1 is never bound: nothing found
          check 4 --flag-that-does-not-exist
          check 4 list --proto banana     # not a protocol
          check 4 kill 99999              # outside the port range
          check 0 list
