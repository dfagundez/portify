name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Fail the build on warnings rather than letting them pile up.
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows first: it is the primary target platform.
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # The frontend must be built before any cargo command that touches the
      # app crate: `tauri::generate_context!` embeds app/dist at compile time
      # and fails if the directory does not exist.
      - name: Build frontend
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Smoke-test the CLI
        shell: bash
        run: |
          cargo run -q -p portify-cli -- --version
          cargo run -q -p portify-cli -- list --json > ports.json
          cargo run -q -p portify-cli -- info
          cargo run -q -p portify-cli -- completions bash > /dev/null
          # Port 1 is never bound, so this must report "nothing found" (exit 2)
          # rather than succeeding or crashing.
          set +e
          cargo run -q -p portify-cli -- list 1
          code=$?
          set -e
          test "$code" -eq 2 || { echo "expected exit 2 for a free port, got $code"; exit 1; }
